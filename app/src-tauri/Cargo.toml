[package]
name = "specdeck-app"
description = "SpecDeck desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "specdeck_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
specdeck-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.8"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Opens agents' install pages, from Rust only: the webview has no opener permission.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
specdeck-protocol.workspace = true
# Only for the error type of the service check; the connection itself is specdeck-core's.
tokio-tungstenite = { version = "0.30", default-features = false }
# Asks the sharing service whether it serves the web viewer. The updater already brings this
# reqwest, with the same TLS.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The diagnostic log: specdeck-core emits the events, this writes them (diagnostics.rs).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[dev-dependencies]
tempfile = "3"
specdeck-server = { path = "../../crates/server" }
