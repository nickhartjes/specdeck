[package]
name = "specdeck-app"
description = "SpecDeck desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "specdeck_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
specdeck-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.8"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Opens agents' install pages, from Rust only: the webview has no opener permission.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
specdeck-protocol.workspace = true
# Only for the error type of the service check; the connection itself is specdeck-core's.
tokio-tungstenite = { version = "0.30", default-features = false }
# Asks the sharing service whether it serves the web viewer. The updater already brings this
# reqwest, with the same TLS.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The diagnostic log: specdeck-core emits the events, specdeck-diag writes them.
specdeck-diag.workspace = true
# Session processes (`session-processes`): the local protocol, and the session's messages.
specdeck-local.workspace = true
specdeck-session.workspace = true
tracing = "0.1"
# Shared files' bytes to and from the window, and the screenshots of Claude's browser.
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
# Starts session processes detached from the app.
libc = "0.2"

# Claude's browser (`claude-browser` design decision 5): WebKit's own calls for JavaScript with a
# result and snapshots, and AppKit for the JPEG. All already in the tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
getrandom = "0.4"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }

[dev-dependencies]
tempfile = "3"
specdeck-server = { path = "../../crates/server" }

# The native crash tests keep Windows' crash dialog from waiting on CI (`tests/native_crash.rs`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }
