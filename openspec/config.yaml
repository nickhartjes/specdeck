schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - "A feature is not done until it is documented. Impact names the documentation: the README overview line (linked to its docs page), the docs/site page or section, and the video in docs/video or why none is needed. A change that is not user-facing says so and why."
  tasks:
    - "A feature is not done until it is documented. In the task group of each user-facing feature, add tasks for its README overview line with a link to its docs page, its docs/site page or section (what it does; who can use it: host, viewer, web viewer; how, with shortcuts and settings; listed in docs/site/sidebar.mjs), and its video in docs/video or why none is needed. Verify them with `just docs-build`."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
