# Signalling service and TURN relay for SpecDeck 1.x. See deploy/k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - signalling.yaml
  - coturn.yaml
# The signed release image. `1` follows the newest 1.x release on each pull; pin an exact version
# (newTag: 1.6.0) or a digest in your overlay for production. See deploy/k8s/README.md.
images:
  - name: ghcr.io/nickhartjes/specdeck-signalling
    newTag: "1"
# Shared TURN secret; create turn-secret.env (not committed) with a line TURN_SECRET=<random value>.
secretGenerator:
  - name: specdeck-turn
    envs:
      - turn-secret.env
configMapGenerator:
  - name: specdeck-network
    literals:
      # Public address of the TURN service, as coturn should advertise it.
      - TURN_EXTERNAL_IP=203.0.113.10
      # TURN URLs as apps reach them (comma-separated). UDP only.
      - TURN_URLS=turn:turn.example.com:3478?transport=udp
