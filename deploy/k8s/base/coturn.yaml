apiVersion: apps/v1
kind: Deployment
metadata:
  name: specdeck-turn
  labels: { app: specdeck-turn }
spec:
  replicas: 1
  selector:
    matchLabels: { app: specdeck-turn }
  template:
    metadata:
      labels: { app: specdeck-turn }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: coturn
          image: coturn/coturn:4.7
          args:
            - --log-file=stdout
            - --listening-port=3478
            # Relay ports; must match the ports exposed by the Service below.
            - --min-port=49160
            - --max-port=49179
            - --external-ip=$(TURN_EXTERNAL_IP)
            - --realm=specdeck
            # Credentials come from the sharing service (TURN REST API scheme).
            - --use-auth-secret
            - --static-auth-secret=$(TURN_SECRET)
            - --fingerprint
            # The root filesystem is read-only; the pid file goes to the writable state volume.
            - --pidfile=/var/lib/coturn/turnserver.pid
            - --no-cli
            # The app reaches TURN over UDP only (libjuice has no TURN over TCP or TLS).
            - --no-tcp
            - --no-tls
            - --no-dtls
            - --no-tcp-relay
            - --no-multicast-peers
            # Quotas, so one credential or one session cannot take the whole relay. Each viewer
            # uses about two allocations, and a host one per viewer. Keep the total equal to the
            # number of relay ports above, and raise both together.
            - --user-quota=40
            - --total-quota=20
            # 20 Mbit/s per allocation, in bytes per second. No --bps-capacity: coturn reserves
            # this rate twice (in and out) for every allocation against it, so it limits
            # allocations, not throughput; 200 Mbit/s would admit only 5.
            - --max-bps=2500000
            # Never relay into private or special-purpose networks: otherwise TURN credentials
            # would give access to services inside the cluster. IPv4, then IPv6, including the
            # IPv6 forms of IPv4 addresses (mapped, NAT64, Teredo, 6to4).
            - --denied-peer-ip=0.0.0.0-0.255.255.255
            - --denied-peer-ip=10.0.0.0-10.255.255.255
            - --denied-peer-ip=100.64.0.0-100.127.255.255
            - --denied-peer-ip=127.0.0.0-127.255.255.255
            - --denied-peer-ip=169.254.0.0-169.254.255.255
            - --denied-peer-ip=172.16.0.0-172.31.255.255
            - --denied-peer-ip=192.0.0.0-192.0.0.255
            - --denied-peer-ip=192.0.2.0-192.0.2.255
            - --denied-peer-ip=192.168.0.0-192.168.255.255
            - --denied-peer-ip=198.18.0.0-198.19.255.255
            - --denied-peer-ip=198.51.100.0-198.51.100.255
            - --denied-peer-ip=203.0.113.0-203.0.113.255
            - --denied-peer-ip=224.0.0.0-255.255.255.255
            # No range may start at `::`: coturn then also refuses public IPv4 peers.
            - --denied-peer-ip=::1-::ffff:ffff
            - --denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
            - --denied-peer-ip=64:ff9b::-64:ff9b:ffff:ffff:ffff:ffff:ffff:ffff
            - --denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
            - --denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
            - --denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
            - --denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
            - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
            - --denied-peer-ip=fe80::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
            - --denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
            # Except coturn's own relay address: when both peers are relayed, coturn relays between
            # two of its own ports on the pod's IP.
            - --allowed-peer-ip=$(POD_IP)
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: TURN_EXTERNAL_IP
              valueFrom: { configMapKeyRef: { name: specdeck-network, key: TURN_EXTERNAL_IP } }
            - name: TURN_SECRET
              valueFrom: { secretKeyRef: { name: specdeck-turn, key: TURN_SECRET } }
          ports:
            - { containerPort: 3478, protocol: UDP, name: turn-udp }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            # The image's user nobody, numeric so Kubernetes can check runAsNonRoot.
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # turnserver carries the file capability to bind low ports; without it in the
            # bounding set the binary cannot even be executed.
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          volumeMounts:
            - { name: state, mountPath: /var/lib/coturn }
      volumes:
        - { name: state, emptyDir: {} }
---
# TURN needs UDP and its relay ports reachable from outside, on the same port numbers coturn
# advertises. Kubernetes Services cannot declare port ranges, so every relay port is listed.
# Adjust the type to what the cluster operators agree.
apiVersion: v1
kind: Service
metadata:
  name: specdeck-turn
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: { app: specdeck-turn }
  ports:
    - { name: turn-udp, port: 3478, targetPort: 3478, protocol: UDP }
    - { name: relay-49160, port: 49160, targetPort: 49160, protocol: UDP }
    - { name: relay-49161, port: 49161, targetPort: 49161, protocol: UDP }
    - { name: relay-49162, port: 49162, targetPort: 49162, protocol: UDP }
    - { name: relay-49163, port: 49163, targetPort: 49163, protocol: UDP }
    - { name: relay-49164, port: 49164, targetPort: 49164, protocol: UDP }
    - { name: relay-49165, port: 49165, targetPort: 49165, protocol: UDP }
    - { name: relay-49166, port: 49166, targetPort: 49166, protocol: UDP }
    - { name: relay-49167, port: 49167, targetPort: 49167, protocol: UDP }
    - { name: relay-49168, port: 49168, targetPort: 49168, protocol: UDP }
    - { name: relay-49169, port: 49169, targetPort: 49169, protocol: UDP }
    - { name: relay-49170, port: 49170, targetPort: 49170, protocol: UDP }
    - { name: relay-49171, port: 49171, targetPort: 49171, protocol: UDP }
    - { name: relay-49172, port: 49172, targetPort: 49172, protocol: UDP }
    - { name: relay-49173, port: 49173, targetPort: 49173, protocol: UDP }
    - { name: relay-49174, port: 49174, targetPort: 49174, protocol: UDP }
    - { name: relay-49175, port: 49175, targetPort: 49175, protocol: UDP }
    - { name: relay-49176, port: 49176, targetPort: 49176, protocol: UDP }
    - { name: relay-49177, port: 49177, targetPort: 49177, protocol: UDP }
    - { name: relay-49178, port: 49178, targetPort: 49178, protocol: UDP }
    - { name: relay-49179, port: 49179, targetPort: 49179, protocol: UDP }
