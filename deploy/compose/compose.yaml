# SpecDeck's sharing service on one server: the service (signalling, TURN credentials and the web
# viewer) behind Caddy, which gets the TLS certificate, and coturn as the TURN relay. Copy
# .env.example to .env, fill it in, then run `docker compose up -d`, which pulls the signed release
# image. `docker compose up -d --build` builds it from source instead. After an upgrade from 1.6,
# where the service was called signalling, `docker compose up -d --remove-orphans` stops the old one.
# Guide: https://nickhartjes.github.io/specdeck/self-host/docker-compose/
name: specdeck

services:
  server:
    build:
      context: ../..
      dockerfile: docker/server.Dockerfile
    image: ghcr.io/nickhartjes/specdeck-server:${SPECDECK_VERSION:?Set SPECDECK_VERSION in .env}
    restart: unless-stopped
    environment:
      SPECDECK_LISTEN: 0.0.0.0:8080
      # Caddy sits in front and puts the client's address in X-Forwarded-For, which the rate
      # limits use.
      SPECDECK_TRUSTED_PROXIES: "1"
      SPECDECK_TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      SPECDECK_TURN_URLS: turn:${TURN_DOMAIN:?Set TURN_DOMAIN in .env}:3478?transport=udp
      # A relayed session refreshes its allocation with these credentials: cover a long day.
      SPECDECK_TURN_TTL_SECONDS: "43200"
      # Plain text, for `docker compose logs`. See the configuration reference for the events.
      SPECDECK_LOG_LEVEL: info
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      SPECDECK_DOMAIN: ${SPECDECK_DOMAIN:?Set SPECDECK_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server]

  coturn:
    image: coturn/coturn:4.18
    restart: unless-stopped
    # TURN hands out the server's own address and relay ports, so it uses the host's network
    # rather than a published port per relay port.
    network_mode: host
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49259}
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      - --realm=specdeck
      # Credentials come from the sharing service (TURN REST API scheme).
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --pidfile=/var/lib/coturn/turnserver.pid
      # The app reaches TURN over UDP only (libjuice has no TURN over TCP or TLS).
      - --no-tcp
      - --no-tls
      - --no-tcp-relay
      - --no-multicast-peers
      # Quotas, so one credential or one session cannot take the whole relay. Each viewer uses
      # about two allocations, and a host one per viewer; the total matches the relay range.
      - --user-quota=40
      - --total-quota=${TURN_TOTAL_QUOTA:-100}
      # 20 Mbit/s per allocation, in bytes per second. No --bps-capacity: coturn reserves this
      # rate twice (in and out) for every allocation against it, so it limits allocations, not
      # throughput; 200 Mbit/s would admit only 5.
      - --max-bps=2500000
      # Never relay into private or special-purpose networks: otherwise TURN credentials would give
      # access to the server's own services and its local network. IPv4, then IPv6, including the
      # IPv6 forms of IPv4 addresses (mapped, NAT64, Teredo, 6to4).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.0.2.0-192.0.2.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=198.51.100.0-198.51.100.255
      - --denied-peer-ip=203.0.113.0-203.0.113.255
      - --denied-peer-ip=224.0.0.0-255.255.255.255
      # No range may start at `::`: coturn then also refuses public IPv4 peers.
      - --denied-peer-ip=::1-::ffff:ffff
      - --denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
      - --denied-peer-ip=64:ff9b::-64:ff9b:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
      - --denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    read_only: true
    tmpfs: [/var/lib/coturn]
    security_opt: [no-new-privileges:true]

volumes:
  caddy-data:
  caddy-config:
