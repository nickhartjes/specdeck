<svg color="#1f2328" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" role="img" aria-labelledby="data-flow-l-title data-flow-l-desc">
  <!-- Generated from docs/site/src/assets/security/data-flow.svg with fixed colours for the README. Change the source first, then update this copy and its light or dark twin to match. -->
  <title id="data-flow-l-title">How a SpecDeck session travels</title>
  <desc id="data-flow-l-desc">The host's computer sends the session straight to each viewer over an encrypted connection, or through the TURN relay when a direct connection fails; the relay cannot read it. The sharing service only helps host and viewers find each other and set up the connection: it sees IP addresses, room ids and the connection setup, but never the session.</desc>
  <defs>
    <marker id="data-flow-l-accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:#0969da"/>
    </marker>
    <marker id="data-flow-l-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-size="14" text-anchor="middle" fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Host's computer -->
    <rect x="8" y="70" width="170" height="330" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="93" y="98" font-weight="700" font-size="16">Host's computer</text>
    <rect x="20" y="114" width="146" height="36" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="93" y="137">Coding agent</text>
    <rect x="20" y="160" width="146" height="36" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="93" y="183">Session folder</text>
    <rect x="20" y="206" width="146" height="36" rx="6" fill="none" stroke-width="2" style="stroke:#0969da"/>
    <text x="93" y="229" font-weight="600">SpecDeck</text>
    <g font-size="13" fill-opacity="0.85">
      <text x="93" y="284">Terminal output and</text>
      <text x="93" y="302">file snapshots stay</text>
      <text x="93" y="320">here, only while the</text>
      <text x="93" y="338">session runs</text>
    </g>

    <!-- Viewers -->
    <rect x="462" y="70" width="170" height="330" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="547" y="98" font-weight="700" font-size="16">Viewers</text>
    <rect x="474" y="114" width="146" height="36" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="547" y="137">SpecDeck app</text>
    <rect x="474" y="160" width="146" height="36" rx="6" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="547" y="183">Web browser</text>
    <g font-size="13" fill-opacity="0.85">
      <text x="547" y="284">Watch only: nothing</text>
      <text x="547" y="302">they send reaches</text>
      <text x="547" y="320">the agent unless the</text>
      <text x="547" y="338">host acts on it</text>
    </g>

    <!-- Sharing service -->
    <rect x="208" y="6" width="224" height="122" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="320" y="31" font-weight="700" font-size="16">Sharing service</text>
    <g font-size="13" fill-opacity="0.85">
      <text x="320" y="54">Finds the session and passes</text>
      <text x="320" y="72">on the connection setup.</text>
      <text x="320" y="96">Sees IP addresses, room ids</text>
      <text x="320" y="114">and setup, never the session.</text>
    </g>

    <!-- TURN relay -->
    <rect x="208" y="336" width="224" height="82" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="320" y="361" font-weight="700" font-size="16">TURN relay</text>
    <g font-size="13" fill-opacity="0.85">
      <text x="320" y="383">Forwards encrypted traffic</text>
      <text x="320" y="401">when direct does not work</text>
    </g>

    <!-- Connection setup -->
    <path d="M180 112 L206 92" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#data-flow-l-arrow)" marker-start="url(#data-flow-l-arrow)"/>
    <path d="M434 92 L460 112" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#data-flow-l-arrow)" marker-start="url(#data-flow-l-arrow)"/>

    <!-- Session content, direct -->
    <path d="M182 224 L458 224" fill="none" stroke-width="3" style="stroke:#0969da" marker-end="url(#data-flow-l-accent-arrow)" marker-start="url(#data-flow-l-accent-arrow)"/>
    <text x="320" y="210" font-weight="600" font-size="15" style="fill:#0969da">Session, encrypted (DTLS)</text>
    <text x="320" y="248" font-size="13" fill-opacity="0.85">direct when the networks allow</text>

    <!-- Session content, relayed -->
    <path d="M182 377 L204 377" fill="none" stroke-width="3" stroke-dasharray="6 4" style="stroke:#0969da" marker-start="url(#data-flow-l-accent-arrow)"/>
    <path d="M436 377 L458 377" fill="none" stroke-width="3" stroke-dasharray="6 4" style="stroke:#0969da" marker-end="url(#data-flow-l-accent-arrow)"/>

    <!-- Legend -->
    <path d="M24 456 L60 456" stroke-width="3" style="stroke:#0969da"/>
    <text x="68" y="461" text-anchor="start" font-size="13">Session content, end-to-end encrypted</text>
    <path d="M386 456 L422 456" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="430" y="461" text-anchor="start" font-size="13">Connection setup only</text>
  </g>
</svg>
