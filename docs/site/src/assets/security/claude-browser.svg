<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="claude-browser-title claude-browser-desc" style="max-width:100%;height:auto">
  <title id="claude-browser-title">How Claude's browser connects</title>
  <desc id="claude-browser-desc">On the host's Mac, Claude Code calls the browser tools on SpecDeck's endpoint for the session, which listens on 127.0.0.1 only and needs the session's token; other programs without the token are refused. The endpoint drives a hidden, private WebKit window that cannot use SpecDeck's functions and keeps nothing. That window opens web pages, such as the app Claude is building. Browser steps and screenshots go into the session's timeline, which viewers see.</desc>
  <defs>
    <marker id="claude-browser-accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--sl-color-text-accent, #3b5bdb)"/>
    </marker>
    <marker id="claude-browser-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g font-size="14" text-anchor="middle" fill="currentColor">
    <!-- The host's Mac -->
    <rect x="8" y="8" width="624" height="300" rx="10" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="24" y="33" text-anchor="start" font-weight="700" font-size="16">Host's Mac</text>

    <!-- Claude Code -->
    <rect x="24" y="50" width="170" height="116" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="109" y="76" font-weight="700" font-size="15">Claude Code</text>
    <g font-size="13" fill-opacity="0.85">
      <text x="109" y="100">has the session's</text>
      <text x="109" y="118">token in its</text>
      <text x="109" y="136">environment</text>
    </g>

    <!-- The session's endpoint -->
    <rect x="235" y="50" width="170" height="116" rx="8" fill="none" stroke-width="2" style="stroke:var(--sl-color-text-accent, #3b5bdb)"/>
    <text x="320" y="76" font-weight="700" font-size="15">SpecDeck endpoint</text>
    <g font-size="13" fill-opacity="0.85">
      <text x="320" y="100">127.0.0.1 only</text>
      <text x="320" y="118">/hooks /status /mcp</text>
      <text x="320" y="136">each needs the token</text>
    </g>

    <!-- Claude's browser -->
    <rect x="446" y="50" width="170" height="116" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="531" y="76" font-weight="700" font-size="15">Claude's browser</text>
    <g font-size="13" fill-opacity="0.85">
      <text x="531" y="100">hidden, private WebKit</text>
      <text x="531" y="118">window: no SpecDeck</text>
      <text x="531" y="136">functions, keeps nothing</text>
    </g>

    <!-- Other programs -->
    <rect x="24" y="214" width="170" height="64" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3"/>
    <text x="109" y="240" font-weight="600">Other programs</text>
    <text x="109" y="260" font-size="13" fill-opacity="0.85">without the token</text>
    <path d="M160 214 L250 170" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#claude-browser-arrow)"/>
    <path d="M196 184 L212 200 M212 184 L196 200" stroke="currentColor" stroke-width="2.5"/>
    <text x="222" y="208" text-anchor="start" font-size="13" fill-opacity="0.85">refused</text>

    <!-- Timeline -->
    <rect x="290" y="208" width="270" height="76" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="425" y="232" font-weight="600">Session timeline</text>
    <text x="425" y="252" font-size="13" fill-opacity="0.85">browser steps and screenshots,</text>
    <text x="425" y="270" font-size="13" fill-opacity="0.85">which viewers see</text>
    <path d="M340 168 L340 204"fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#claude-browser-arrow)"/>

    <!-- Tool calls -->
    <path d="M196 108 L231 108" fill="none" stroke-width="3" style="stroke:var(--sl-color-text-accent, #3b5bdb)" marker-end="url(#claude-browser-accent-arrow)"/>
    <path d="M407 108 L442 108" fill="none" stroke-width="3" style="stroke:var(--sl-color-text-accent, #3b5bdb)" marker-end="url(#claude-browser-accent-arrow)"/>

    <!-- Web pages -->
    <rect x="446" y="330" width="170" height="64" rx="8" fill="none" stroke="currentColor" stroke-opacity="0.5"/>
    <text x="531" y="356" font-weight="600">Web pages</text>
    <text x="531" y="376" font-size="13" fill-opacity="0.85">your local app, any site</text>
    <path d="M600 168 L600 326" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.5" marker-end="url(#claude-browser-arrow)"/>

    <!-- Lifetime -->
    <g font-size="13" fill-opacity="0.85" text-anchor="start">
      <text x="24" y="352">One browser per session. It closes with the</text>
      <text x="24" y="370">session, and starts clean after a restart.</text>
    </g>
  </g>
</svg>
