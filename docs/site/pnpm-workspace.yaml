# The documentation site is its own workspace with its own lockfile, so its dependencies stay out
# of the app's (and out of the pnpm dependency hash in nix/package.nix).
packages:
  - .
# As in the app's workspace: skip versions published less than a day ago (in minutes).
minimumReleaseAge: 1440
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  # Renovate security update: astro@7.4.7
  - astro@7.4.7
