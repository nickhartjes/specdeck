<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- A second design for the session window, made with the frontend-design skill; see README.md next to it. -->
<title>SpecDeck Session Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept: the window as a stage manager's prompt book. Paper and ink around a dark stage (the
   terminal, where the agent acts). One bold element: the cue rail in the timeline, whose amber
   light is the same light as the session's state lamp. Plum belongs to the host: everything the
   host asks of viewers wears it. Type: Atkinson Hyperlegible Next for words, its Mono for code. */
:root {
  --paper: #e6ebe6; --sheet: #f8faf7; --sheet-2: #eef2ee; --hover: #e2e8e3;
  --rule: #cbd4cf; --rule-strong: #a7b4ae;
  --ink: #142b2a; --ink-2: #4a5f5c; --ink-3: #74878a;
  --accent: #6a2c5e; --accent-hover: #58224d; --accent-ink: #ffffff; --accent-wash: #f2e5ef;
  --cue: #9a5b00; --cue-light: #e39b1b; --cue-wash: #f7ebd5;
  --attn: #b13e28; --attn-wash: #f8e2dc;
  --ready: #2a6e4c; --ready-wash: #dcefe3;
  --add-bg: #dcefe2; --add-ink: #1d6237; --del-bg: #f6e0dc; --del-ink: #992d21; --mark: #2a6e4c;
  --stage: #102221; --stage-2: #183130; --stage-ink: #d6e3df; --stage-dim: #7e9893;
  --stage-prompt: #e6abd8; --stage-ok: #8fd3a6; --stage-q: #f4a68f; --stage-cue: #f1b24a; --stage-rule: #2a4442;
  --p-nick: #6a2c5e; --p-sanne: #2b6e61; --p-mo: #3a5a9c; --on-p: #ffffff;
  --focus: #3a5a9c; --scrim: rgba(20, 43, 42, 0.18); --glow: rgba(227, 155, 27, 0.35);
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --paper: #0f1a1a; --sheet: #152322; --sheet-2: #0c1615; --hover: #1c2e2d;
  --rule: #263a38; --rule-strong: #3a5350;
  --ink: #dce7e3; --ink-2: #a0b2ae; --ink-3: #6f8480;
  --accent: #d89dca; --accent-hover: #e6b4da; --accent-ink: #2a0f24; --accent-wash: #33202e;
  --cue: #eaa63c; --cue-light: #f2b24b; --cue-wash: #392a12;
  --attn: #f08a72; --attn-wash: #3c1f19;
  --ready: #7bcb9c; --ready-wash: #173225;
  --add-bg: #173323; --add-ink: #93d6aa; --del-bg: #3b1d1a; --del-ink: #f2a094; --mark: #7bcb9c;
  --stage: #091312; --stage-2: #112120; --stage-ink: #d6e3df; --stage-dim: #6f8a85;
  --stage-prompt: #e6abd8; --stage-ok: #8fd3a6; --stage-q: #f4a68f; --stage-cue: #f1b24a; --stage-rule: #22383a;
  --p-nick: #d89dca; --p-sanne: #6cc2ae; --p-mo: #93adea; --on-p: #0f1a1a;
  --focus: #93adea; --scrim: rgba(0, 0, 0, 0.45); --glow: rgba(242, 178, 75, 0.3);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1a1a; --sheet: #152322; --sheet-2: #0c1615; --hover: #1c2e2d;
  --rule: #263a38; --rule-strong: #3a5350;
  --ink: #dce7e3; --ink-2: #a0b2ae; --ink-3: #6f8480;
  --accent: #d89dca; --accent-hover: #e6b4da; --accent-ink: #2a0f24; --accent-wash: #33202e;
  --cue: #eaa63c; --cue-light: #f2b24b; --cue-wash: #392a12;
  --attn: #f08a72; --attn-wash: #3c1f19;
  --ready: #7bcb9c; --ready-wash: #173225;
  --add-bg: #173323; --add-ink: #93d6aa; --del-bg: #3b1d1a; --del-ink: #f2a094; --mark: #7bcb9c;
  --stage: #091312; --stage-2: #112120; --stage-ink: #d6e3df; --stage-dim: #6f8a85;
  --stage-prompt: #e6abd8; --stage-ok: #8fd3a6; --stage-q: #f4a68f; --stage-cue: #f1b24a; --stage-rule: #22383a;
  --p-nick: #d89dca; --p-sanne: #6cc2ae; --p-mo: #93adea; --on-p: #0f1a1a;
  --focus: #93adea; --scrim: rgba(0, 0, 0, 0.45); --glow: rgba(242, 178, 75, 0.3);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 13px/1.45 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.92em; }
svg { flex: none; }
[hidden] { display: none !important; }

.shell { display: flex; flex-direction: column; gap: 10px; min-height: calc(100dvh - 24px); max-width: 1600px; margin: 0 auto; }

/* Concept controls, outside the window */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; color: var(--ink-2); font-size: 12px; }
.demo .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.who-pick { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.who-pick button { border: 0; background: none; padding: 5px 10px; display: inline-flex; gap: 6px; align-items: center; }
.who-pick button + button { border-left: 1px solid var(--rule); }
.who-pick button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.who-pick small { color: inherit; opacity: 0.75; }
.linkish { border: 0; background: none; padding: 4px 2px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.linkish:hover { color: var(--ink); }

/* Window */
.win { flex: 1; display: flex; flex-direction: column; min-height: 620px; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 10px; overflow: hidden; position: relative; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; position: relative; }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--cue-light); box-shadow: 0 0 0 4px var(--glow); }
.lamp.waiting { background: var(--attn); box-shadow: 0 0 0 4px var(--attn-wash); }
.lamp.ended { background: var(--ink-3); box-shadow: none; }
.state { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.state b { font-weight: 700; font-size: 14px; }
.state span { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule-strong); color: var(--ink-2); }
.spacer { flex: 1; }
.people { display: flex; align-items: center; }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--on-p); background: var(--p-nick); flex: none; }
.av.Sanne { background: var(--p-sanne); } .av.Mo { background: var(--p-mo); }
.people .av { border: 2px solid var(--sheet); margin-left: -5px; width: 26px; height: 26px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--rule-strong); background: var(--sheet); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn svg { width: 15px; height: 15px; }
.btn.host { border-color: var(--accent); color: var(--accent); }
.btn.host:hover { background: var(--accent-wash); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.quiet { border-color: transparent; background: none; }
.btn.quiet:hover { background: var(--hover); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.good { border-color: var(--ready); color: var(--ready); background: var(--ready-wash); }
.btn.danger { border-color: var(--attn); color: var(--attn); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.icon-btn { position: relative; width: 30px; height: 30px; padding: 0; justify-content: center; }
.icon-btn[aria-pressed="true"] { background: var(--sheet-2); border-color: var(--rule-strong); }
.count { position: absolute; top: -5px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--attn); color: var(--sheet); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.count.inline { position: static; display: inline-grid; background: var(--accent); color: var(--accent-ink); margin-left: 4px; }

/* Requests from the host: a strip under the toolbar */
.standby:empty { display: none; }
.req { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; background: var(--accent-wash); border-bottom: 1px solid var(--rule); border-left: 4px solid var(--accent); }
.req .what { display: flex; flex-direction: column; min-width: 200px; flex: 1; }
.req .what b { font-weight: 700; }
.req .what span { color: var(--ink-2); font-size: 12px; }
.roll { display: flex; flex-wrap: wrap; gap: 6px; }
.roll span { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 2px; border-radius: 999px; background: var(--sheet); font-size: 12px; color: var(--ink-2); }
.roll span.done { color: var(--ready); background: var(--ready-wash); font-weight: 500; }
.roll .av { width: 18px; height: 18px; font-size: 10px; }
.clock { font-size: 18px; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.clock.low { color: var(--attn); }
.clock small { font-size: 12px; color: var(--ink-2); }
.deck { display: flex; gap: 5px; flex-wrap: wrap; }
.card { width: 34px; height: 46px; border-radius: 5px; border: 1px solid var(--rule-strong); background: var(--sheet); font-size: 15px; font-weight: 700; display: grid; place-items: center; }
.card:hover { border-color: var(--accent); }
.card[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); transform: translateY(-3px); }
.spread { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; min-width: 220px; flex: 1; max-width: 380px; }
.spread b { font-size: 15px; text-align: right; }
.spread .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.spread i { display: block; height: 10px; background: var(--accent); border-radius: 2px; }

/* Narrow-screen pane switch */
.panesw { display: none; border-bottom: 1px solid var(--rule); }
.panesw button { flex: 1; border: 0; background: none; padding: 8px; color: var(--ink-2); border-bottom: 2px solid transparent; }
.panesw button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }

/* Main grid */
.main { flex: 1; display: grid; min-height: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.files { grid-area: files; background: var(--sheet-2); border-right: 1px solid var(--rule); }
.work { grid-area: work; }
.cues { grid-area: cues; border-left: 1px solid var(--rule); }
.win[data-who="po"] .cues { border-left: 0; border-right: 1px solid var(--rule); }
.win[data-who="po"] .files { border-right: 0; border-left: 1px solid var(--rule); }
.head { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; border-bottom: 1px solid var(--rule); min-height: 38px; flex-wrap: wrap; }
.ptab { border: 0; background: none; padding: 6px 8px 7px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 5px; }
.ptab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.foot { padding: 10px 12px; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.toggle { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
.toggle button { border: 0; background: var(--sheet); padding: 3px 9px; font-size: 12px; }
.toggle button + button { border-left: 1px solid var(--rule); }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.toggle button[disabled] { opacity: 0.45; cursor: not-allowed; }

/* File lists */
.flist { list-style: none; margin: 0; padding: 6px 0 12px; }
.dir { padding: 10px 12px 3px; color: var(--ink-3); font-size: 11.5px; overflow-wrap: anywhere; }
.fi { width: 100%; display: flex; align-items: baseline; gap: 8px; padding: 4px 12px 4px 20px; border: 0; background: none; text-align: left; }
.fi:hover { background: var(--hover); }
.fi[aria-current="true"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--ink); }
.fi .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fi .st { font-size: 11.5px; color: var(--ink-3); }
.fi .st.A { color: var(--ready); } .fi .st.M { color: var(--cue); }
.fi .pm { font-size: 11.5px; font-variant-numeric: tabular-nums; }
.fi.faint .nm { color: var(--ink-3); }
.fi .sub { display: block; font-size: 11.5px; color: var(--ink-3); }
.fi .fresh { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); align-self: center; }
.plus { color: var(--add-ink); } .minus { color: var(--del-ink); }

.fgrp { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink); font-weight: 700; font-size: 12.5px; padding-top: 14px; }
.grp-help { padding: 0 12px 4px; color: var(--ink-3); font-size: 11.5px; }
.fi .who-st { display: block; font-size: 11.5px; color: var(--accent); }
.fi .who-st.ok { color: var(--ready); }
.drop { border: 1px dashed var(--rule-strong); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--sheet-2); }
.drop.over { border-color: var(--accent); background: var(--accent-wash); }
.drop input[type="file"] { max-width: 100%; }
.pop .err { color: var(--attn); }
.upimg { margin: 22px 28px; max-width: min(560px, calc(100% - 56px)); border: 1px solid var(--rule); border-radius: 6px; }

/* Work area tabs and editor */
.wtabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--rule); background: var(--sheet-2); min-height: 36px; }
.wtab { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px; border-right: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.wtab > button { border: 0; background: none; padding: 8px 0; display: inline-flex; align-items: center; gap: 6px; color: inherit; }
.wtab.on { background: var(--sheet); color: var(--ink); box-shadow: inset 0 2px 0 var(--ink); }
.wtab.on.term { background: var(--stage); color: var(--stage-ink); box-shadow: inset 0 2px 0 var(--stage-cue); }
.wtab .x { width: 20px; height: 20px; border: 0; background: none; border-radius: 4px; color: var(--ink-3); padding: 0; }
.wtab .x:hover { background: var(--hover); color: var(--ink); }
.wtab .ping { width: 7px; height: 7px; border-radius: 50%; background: var(--attn); }
.wtab svg { width: 14px; height: 14px; }
.editor { flex: 1; overflow: auto; min-height: 0; position: relative; }
.filebar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 8px 14px; background: var(--sheet); border-bottom: 1px solid var(--rule); color: var(--ink-2); font-size: 12px; }
.filebar .path { color: var(--ink); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.filebar .toggle { margin: 0; }

.code { font: 12.5px/1.6 var(--mono); padding: 8px 0 24px; min-width: max-content; }
.ln { display: grid; grid-template-columns: 44px 18px auto; padding-right: 20px; }
.ln .n { color: var(--ink-3); text-align: right; padding-right: 10px; user-select: none; }
.ln .m { color: var(--ink-3); user-select: none; }
.ln .t { white-space: pre; }
.ln.add { background: var(--add-bg); } .ln.add .m, .ln.add .t { color: var(--add-ink); }
.ln.del { background: var(--del-bg); } .ln.del .m, .ln.del .t { color: var(--del-ink); }
.ln.mark { box-shadow: inset 3px 0 0 var(--mark); background: var(--add-bg); }
.ln.flash, .tline.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--cue-wash); } }

.doc { max-width: 66ch; padding: 22px 28px 40px; font-size: 15px; line-height: 1.6; }
.doc h1 { font-size: 24px; line-height: 1.2; font-weight: 700; margin: 0 0 14px; }
.doc h2 { font-size: 16px; font-weight: 700; margin: 22px 0 6px; }
.doc p { margin: 0 0 10px; }
.doc ul { margin: 0 0 12px; padding-left: 20px; }
.doc li { margin: 3px 0; }
.doc li.task { list-style: none; margin-left: -20px; display: flex; gap: 8px; align-items: baseline; }
.doc li.task.done span { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.doc .new { position: relative; box-shadow: -14px 0 0 -11px var(--accent); }
.doc .new::after { content: "New since you last read"; display: block; font-size: 11.5px; color: var(--accent); }
.doc code { background: var(--sheet-2); padding: 1px 4px; border-radius: 3px; }
.notice { max-width: 52ch; margin: 48px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.notice b { color: var(--ink); font-size: 15px; }
.wire { margin: 22px 28px; max-width: 460px; border: 1px solid var(--rule-strong); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--sheet-2); }
.wire .pill { align-self: flex-start; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--attn); color: var(--attn); font-size: 12px; }
.wire i { display: block; height: 40px; background: var(--rule); border-radius: 3px; }
.wire i + i { height: 70px; }

/* The stage: the terminal */
.term { background: var(--stage); color: var(--stage-ink); font: 12.5px/1.55 var(--mono); padding: 12px 16px 8px; min-height: 100%; display: flex; flex-direction: column; }
.tline { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.55em; }
.tline.dim { color: var(--stage-dim); } .tline.ac { color: var(--stage-prompt); } .tline.ok, .tline.add { color: var(--stage-ok); }
.tline.q { color: var(--stage-q); } .tline.wk { color: var(--stage-cue); }
.tchoice { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 8px 2ch; align-items: flex-start; }
.tchoice button { font: inherit; background: var(--stage-2); color: var(--stage-ink); border: 1px solid var(--stage-rule); border-radius: 4px; padding: 3px 10px; text-align: left; }
.tchoice button:hover { border-color: var(--stage-cue); }
.tinput { margin-top: auto; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--stage-rule); padding-top: 8px; position: sticky; bottom: 0; background: var(--stage); }
.tinput label { color: var(--stage-prompt); }
.tinput input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--stage-ink); font: inherit; padding: 4px 0; }
.tinput input::placeholder { color: var(--stage-dim); }
.tinput .hint { color: var(--stage-dim); font-size: 11.5px; }
.tro { margin-top: auto; border-top: 1px solid var(--stage-rule); padding-top: 8px; color: var(--stage-dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--font); font-size: 12px; position: sticky; bottom: 0; background: var(--stage); }
.tro button { border: 1px solid var(--stage-rule); background: var(--stage-2); color: var(--stage-ink); border-radius: 4px; padding: 3px 9px; }

/* The cue rail: the timeline */
.rail { padding: 14px 14px 24px 6px; }
.cue { display: grid; grid-template-columns: 34px 1fr; column-gap: 8px; }
.cue-no { font-size: 24px; line-height: 1; text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
.cue-body { border-left: 2px solid var(--rule-strong); padding: 0 0 18px 14px; min-width: 0; }
.cue:last-of-type .cue-body { padding-bottom: 8px; }
.cue-who { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.cue-who .av { width: 16px; height: 16px; font-size: 9px; }
.cue-p { font-size: 14px; line-height: 1.4; margin: 3px 0 6px; }
.win[data-who="po"] .cue-p { font-size: 15px; }
.outcome { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; color: var(--ready); font-weight: 500; margin: 2px 0 6px; }
.outcome .linkish { font-weight: 400; font-size: 12px; }
.step { position: relative; width: 100%; display: flex; align-items: baseline; gap: 8px; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 4px; color: var(--ink); }
button.step:hover { background: var(--hover); }
.step::before { content: ""; position: absolute; left: -20px; top: 8px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--ink-3); background: var(--sheet); }
.step.k-edit::before, .step.k-write::before { background: var(--ink-2); border-color: var(--ink-2); }

    const lim = h('select', { id: 'readLimit' }, h('option', { value: '0' }, 'No time limit'), h('option', { value: '120' }, '2 minutes'), h('option', { value: '300', selected: true }, '5 minutes'), h('option', { value: '600' }, '10 minutes'));
    body = [h('label', { class: 'f' }, 'What to read', sel), h('label', { class: 'f' }, 'Time to read', lim), h('p', null, 'Sanne and Mo get a request at the top of their window and say when they are ready.'),
      h('div', { class: 'end' }, cancel, h('button', { type: 'button', class: 'btn primary small', id: 'readGo', onclick: () => { startRead(sel.value, Number(lim.value)); closePop(); } }, 'Ask Sanne and Mo'))];
  } else if (kind === 'estimate') {
    title = 'Ask how big a task is';
    const ta = h('textarea', { id: 'estTask', rows: 2, 'aria-label': 'Task' }, 'Task 3.1: show "unreachable" after three missed heartbeats');
    body = [ta, h('p', null, 'Everyone votes with cards. Votes stay hidden until you reveal them.'),
      h('div', { class: 'end' }, cancel, h('button', { type: 'button', class: 'btn primary small', id: 'estGo', onclick: () => { startEstimate(ta.value.trim() || 'This task'); closePop(); } }, 'Start voting'))];
  } else if (kind === 'add') {
    title = 'Add files or a note';
    const input = h('input', { type: 'file', id: 'upFiles', multiple: true, 'aria-label': 'Files to add' });
    const dest = h('select', { id: 'upDest' },
      h('option', { value: 'braindump' }, 'To the braindump for Claude'),
      h('option', { value: 'everyone' }, 'Share with everyone'),
      h('option', { value: 'project' }, host() ? 'Add to the project' : 'Add to the project, if Nick agrees'));
    const path = h('input', { type: 'text', id: 'upPath', placeholder: 'crates/core/tests/fixtures/', autocomplete: 'off', style: 'padding:5px 7px;border:1px solid var(--rule-strong);border-radius:5px;background:var(--sheet)' });
    const pathLabel = h('label', { class: 'f', hidden: true }, 'Where in the project (a folder, or a file name for one file)', path);
    const note = h('textarea', { id: 'upNote', rows: 3, placeholder: 'Or write a note: ideas, questions, what Claude should know.', 'aria-label': 'Note' });
    const help = h('p', null, 'Everyone adds to one folder. When it is complete, Nick gives the whole folder to Claude.');
    const err = h('p', { class: 'err', role: 'alert' });
    dest.addEventListener('change', () => {
      pathLabel.hidden = dest.value !== 'project';
      note.hidden = dest.value === 'project';
      help.textContent = { braindump: 'Everyone adds to one folder. When it is complete, Nick gives the whole folder to Claude.', everyone: 'For people to look at. Claude does not see it unless Nick puts it in the session folder.', project: host() ? 'The file goes into your copy of the project, where Claude can use it.' : 'For a file Nick does not have: a fixture, a log, a missing file. It goes into his copy of the code only when he agrees.' }[dest.value];
    });
    const drop = h('div', { class: 'drop' }, input, h('span', { style: 'font-size:12px;color:var(--ink-2)' }, 'Or drop files here. Text and Markdown up to 200 KB are sent whole.'));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files.length) input.files = e.dataTransfer.files; });
    body = [h('label', { class: 'f' }, 'Where it goes', dest), drop, pathLabel, note, help, err,
      h('div', { class: 'end' }, cancel, h('button', { type: 'button', class: 'btn primary small', id: 'upGo', onclick: async () => {
        const files = [...(input.files || [])];
        if (!files.length && !(dest.value !== 'project' && note.value.trim())) { err.textContent = dest.value === 'project' ? 'Choose a file to add to the project.' : 'Choose a file or write a note first.'; return; }
        closePop();
        await addUploads(files, dest.value, path.value.trim(), dest.value === 'project' ? '' : note.value);
      } }, 'Add'))];
  } else if (kind === 'give') {
    title = 'Give the braindump to Claude';
    const items = SHARED.filter((f) => f.folder === 'braindump' && !f.given);
    const ta = h('textarea', { id: 'giveText', rows: 5, 'aria-label': 'Prompt for Claude' }, `Read everything in shared/braindump/ (${items.map((f) => f.name).join(', ')}). Turn it into a short list of requirements for the heartbeat work, and ask me about anything that is unclear or contradicts the plan.`);
    body = [h('p', null, `The ${items.length} files are copied into shared/braindump/ in the session folder, then this prompt goes to Claude. Edit it first if you like.`), ta,
      h('div', { class: 'end' }, cancel, h('button', { type: 'button', class: 'btn primary small', id: 'giveGo', onclick: () => { const t = ta.value.trim(); if (!t) return; closePop(); giveBraindump(t); } }, 'Give to Claude'))];
  } else if (kind === 'sharing') {
    title = 'What viewers may see and do';
    const st = S.settings;
    const chk = (key, label, help) => h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: st[key], onchange: (e) => { st[key] = e.target.checked; renderAll(); renderEditor(); } }), h('span', null, label, h('small', null, help)));
    const code = h('select', { id: 'setCode', onchange: (e) => { st.code = e.target.value; if (st.code !== 'project' && !isHost()) S.scope = 'touched'; renderAll(); renderEditor(); } },
      h('option', { value: 'changes', selected: st.code === 'changes' }, 'Only the changes Claude makes'),
      h('option', { value: 'whole', selected: st.code === 'whole' }, 'Changed files, whole, with changes marked'),
      h('option', { value: 'project', selected: st.code === 'project' }, 'Any file in the project'));
    body = [h('label', { class: 'f' }, 'Code viewers can open', code),
      chk('suggest', 'Viewers can suggest prompts', 'Nothing reaches Claude until you send it.'),
      chk('shareFiles', 'Viewers can add files and notes', 'To the braindump, to share, or offered for the project. You decide what goes into the project.'),
      chk('recap', 'Viewers can save a recap', 'Prompts, plans and decisions, after the session ends.'),
      h('p', null, 'Private files, such as .env, are never shared.'),
      h('div', { class: 'end' }, h('button', { type: 'button', class: 'btn primary small', onclick: closePop }, 'Done'))];
  } else if (kind === 'end') {
    title = 'End the session for everyone?';
    body = [h('p', null, 'Claude stops, viewers are disconnected, and everyone gets the recap. The terminal output is not kept.'),
      h('div', { class: 'end' }, h('button', { type: 'button', class: 'btn small', onclick: closePop }, 'Keep going'), h('button', { type: 'button', class: 'btn primary small', onclick: () => { closePop(); setEnded(true); } }, 'End session'))];
  } else {
    title = 'Notifications';
    S.notes.forEach((x) => { x.wasUnread = x.unread; x.unread = false; });
    renderBell();
    body = [S.notes.length ? h('ul', { class: 'notes' }, ...S.notes.map((x) => h('li', { class: x.wasUnread ? 'unread' : '' }, h('b', null, x.title), h('span', null, x.text)))) : h('p', null, 'Nothing yet. Requests from Nick, questions from Claude and new suggestions show up here.'),
      h('fieldset', null, h('legend', null, 'Also pop up when'), ...Object.entries(KINDS).filter(([k]) => isHost() ? k !== 'request' : k !== 'suggestion').map(([k, label]) =>
        h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: S.notify[k], onchange: (e) => { S.notify[k] = e.target.checked; } }), h('span', null, label)))),
      h('div', { class: 'end' }, h('button', { type: 'button', class: 'btn small', onclick: closePop }, 'Close'))];
  }
  pop.append(h('div', { class: 'pop', role: 'dialog', 'aria-label': title }, h('h2', null, title), ...body));
  const first = pop.querySelector('select, textarea, input, .btn.primary'); if (first) first.focus();
}

/* ---------- Recap ---------- */
function renderRecap() {
  const r = $('#recap'); r.replaceChildren();
  if (!S.ended) return;
  const turns = TIMELINE.concat(S.extra);
  const allowed = isHost() || S.settings.recap;
  r.append(h('div', { class: 'recap-in' },
    h('h1', null, 'Viewer heartbeat, planned and half built'),
    h('div', { class: 'meta' }, 'specshare, hosted by Nick, with Sanne and Mo. Ended just now after 52 minutes.'),
    h('h2', null, 'Prompts and what came of them'),
    h('ol', null, ...turns.map((t) => h('li', null, t.prompt, h('small', null, (t.by ? `Suggested by ${t.by}. ` : '') + (t.outcome === 'Working on it' ? 'Stopped when the session ended.' : t.outcome))))),
    h('h2', null, 'Plans and documents'),
    h('ul', null, h('li', null, 'Viewer heartbeat, ', h('code', null, 'design.md'), h('small', null, 'A heartbeat every 3 seconds. Unreachable after three missed.')),
      h('li', null, h('code', null, 'tasks.md'), h('small', null, '3 of 6 tasks done')),
      ...SHARED.filter((f) => f.kind === 'md').map((f) => h('li', null, h('code', null, f.name), h('small', null, `Shared by ${f.by}`)))),
    S.events.length > 0 && h('h2', null, 'Decisions'),
    S.events.length > 0 && h('ul', null, ...S.events.map((e) => h('li', null, e.title + ' ' + e.text))),
    h('h2', null, 'Files changed'),
    h('ul', null, ...Object.entries(FILES).filter(([, f]) => f.st !== 'R').map(([p, f]) => h('li', null, h('code', null, p), h('small', null, f.st === 'A' ? 'Created' : 'Changed')))),
    h('div', { class: 'acts' },
      allowed ? h('button', { type: 'button', class: 'btn primary', onclick: () => notify('ended', 'Recap saved', 'specshare-recap-2026-11-07.md. In this concept nothing is written to disk.') }, 'Save recap') : h('span', null, 'Nick did not allow saving a recap of this session.'),
      h('span', null, 'The recap holds no code and no terminal output.'))));
}
function setEnded(on) {
  S.ended = on; S.read = null; S.estimate = null; S.waiting = false;
  if (on) notify('ended', 'The session has ended', isHost() || S.settings.recap ? 'The recap is ready to save.' : 'Nick did not allow saving a recap.');
  renderAll(); renderEditor();
}

/* ---------- People ---------- */
function setWho(v) {
  S.who = v; S.editing = null; if (S.pop) closePop();
  if (v === 'host') S.late = false;
  if (!isHost() && S.settings.code !== 'project') S.scope = 'touched';
  S.docks = { files: true, cues: true };
  if (v === 'po') { S.filesTab = 'docs'; S.detail = 'summary'; S.tabs = ['openspec/changes/viewer-heartbeat/design.md']; S.active = S.tabs[0]; S.pane = 'cues'; }
  else if (v === 'dev') { S.filesTab = 'code'; S.detail = 'details'; S.tabs = ['terminal', 'crates/protocol/src/message.rs']; S.active = 'crates/protocol/src/message.rs'; S.pane = 'work'; }
  else { S.filesTab = 'code'; S.detail = 'details'; S.tabs = ['terminal']; S.active = 'terminal'; S.pane = 'work'; }
  S.tabs.forEach((t) => seen.add(t + v));
  renderAll(); renderEditor();
}
function renderAll() { layout(); renderChrome(); renderFiles(); renderTabs(); renderCues(); renderStandby(); renderRecap(); renderBell(); }

$('#whoPick').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setWho(b.dataset.v); });
$('#panesw').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) showPane(b.dataset.v); });
$('#tglFiles').onclick = () => { S.docks.files = !S.docks.files; layout(); };
$('#tglCues').onclick = () => { S.docks.cues = !S.docks.cues; layout(); };
$('#askRead').onclick = () => openPop('read');
$('#askEstimate').onclick = () => openPop('estimate');
$('#sharingBtn').onclick = () => openPop('sharing');
$('#endBtn').onclick = () => openPop('end');
$('#bellBtn').onclick = () => openPop('bell');
$('#simAsk').onclick = () => {
  if (S.waiting) return answer(1);
  S.waiting = true; renderAll(); if (S.active === 'terminal') renderEditor();
  notify('waiting', isHost() ? 'Claude is waiting for you' : 'Claude is waiting for Nick', isHost() ? 'It asks a question in the terminal.' : 'Nick answers in the terminal.');
};
$('#simSuggest').onclick = () => {
  S.suggestions.push({ id: S.nextId++, from: 'Sanne', text: 'Can the people list show who is reading the plan right now?', status: 'pending', when: 'just now' });
  if (isHost()) notify('suggestion', 'Sanne suggests a prompt', 'Open Prompts to send, edit, keep or decline it.');
  renderCues();
};
$('#simLate').onclick = () => { S.late = !S.late; S.expanded.clear(); renderChrome(); renderCues(); if (S.late && narrow()) showPane('cues'); };
$('#simEnd').onclick = () => setEnded(!S.ended);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.pop) closePop(); });
document.addEventListener('click', (e) => { if (S.pop && !e.target.closest('#pop') && !e.target.closest('[aria-haspopup]')) closePop(); });
window.matchMedia('(max-width: 760px)').addEventListener?.('change', () => layout());

setInterval(() => {
  const r = S.read;
  if (r && r.limit) { r.left = Math.max(0, r.left - 1); if (!r.left) endRead(true); else { const c = document.getElementById('readClock'); if (c) { c.textContent = fmt(r.left); c.classList.toggle('low', r.left <= 30); } } }
  if (S.waiting || S.ended) return;
  S.seconds++;
  const sp = document.getElementById('spin'); if (sp) sp.textContent = `✻ ${workLabel()}… (${S.seconds}s, esc to interrupt)`;
  const nw = document.getElementById('now'); if (nw) nw.textContent = `${workLabel()}, ${S.seconds} s`;
  $('#stateTitle').textContent = `${workLabel()}, ${S.seconds} s`;
}, 1000);

if (narrow()) S.pane = 'work';
setWho('host');
</script>
</body>
</html>
