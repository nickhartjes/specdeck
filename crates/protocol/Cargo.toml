[package]
name = "specdeck-protocol"
description = "SpecDeck wire protocol: messages, frames, signing and invite codes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# History frames: compressed with zstd by hosts; the web viewer decompresses them with ruzstd,
# which builds for WebAssembly (web-viewer design decision 2).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
ruzstd = "0.9"

[dev-dependencies]
# Tests decode zstd's output through the web viewer's decoder as well.
ruzstd = "0.9"
