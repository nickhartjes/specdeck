[package]
name = "specdeck-diag"
description = "SpecDeck's diagnostic log, written by the app and by session processes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
specdeck-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# specdeck-core emits the events; this writes them.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }

# The OS's version for the launch record (`system.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The OS's version, and the record of a crash Windows ends the app for (`windows_crash.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
