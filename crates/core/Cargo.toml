[package]
name = "specdeck-core"
description = "SpecDeck session engine for hosts and viewers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
specdeck-protocol.workspace = true
tracing = "0.1"
datachannel = { version = "0.16", features = ["vendored"] }
futures-util = "0.3"
getrandom = "0.4"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alacritty_terminal = "0.26"
axum = "0.8"
# Screenshots too large for the timeline are made smaller (`browser-screenshots-in-timeline`);
# the same version Tauri already pulls into the app.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "net", "macros", "time", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# The crypto for wss:// signalling: tokio-tungstenite's rustls comes without one, and connecting
# panics until exactly one is enabled. ring builds without cmake or nasm on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
specdeck-server = { path = "../server" }
env_logger = "0.11"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
