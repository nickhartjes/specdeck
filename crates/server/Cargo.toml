[package]
name = "specdeck-server"
description = "SpecDeck sharing service: matchmaking, TURN credentials and the web viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
specdeck-protocol.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
futures-util = "0.3"
getrandom = "0.4"
hmac = "0.13"
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The web viewer's page, embedded in the binary (web-viewer design decision 5).
rust-embed = { version = "8.13", optional = true, features = ["debug-embed", "interpolate-folder-path"] }

[features]
# Serve the web viewer. Needs the page built first: just web-wasm, then pnpm --dir app/ui build:web.
web-viewer = ["dep:rust-embed"]

[dev-dependencies]
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
