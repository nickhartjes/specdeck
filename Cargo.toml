[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/diag", "crates/local", "crates/server", "crates/web", "app/src-tauri"]

[workspace.package]
version = "1.6.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
specdeck-protocol = { path = "crates/protocol" }
specdeck-core = { path = "crates/core" }
specdeck-diag = { path = "crates/diag" }
