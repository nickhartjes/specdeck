# Writes Casks/specdeck.rb in nickhartjes/homebrew-tap for a published release (design decision
# 13). Called by release.yml after each release; run it by hand to (re)write the cask for an
# existing tag.
#
# Secret of the `release` environment (v* tags and main only; see release.yml):
#   HOMEBREW_TAP_DEPLOY_KEY   private SSH deploy key with write access to nickhartjes/homebrew-tap
#                             (the job is skipped with a warning while it is missing)
name: Homebrew cask

on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true

permissions:
  contents: read

jobs:
  cask:
    name: Update Homebrew cask
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ inputs.tag }}
      REPO: ${{ github.repository }}
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      # Without a Developer ID the app is ad-hoc signed; the cask then explains how to open it.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Check for the tap deploy key
        run: |
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the Homebrew cask was not updated."
          fi
      - uses: actions/checkout@v7
        if: env.TAP_KEY != ''
      - name: Checkout tap
        if: env.TAP_KEY != ''
        uses: actions/checkout@v7
        with:
          repository: nickhartjes/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Render cask
        if: env.TAP_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$REPO" -p 'SpecDeck-arm64.dmg' -p 'SpecDeck-x64.dmg' -D dmg
          sha_arm=$(sha256sum dmg/SpecDeck-arm64.dmg | awk '{print $1}')
          sha_intel=$(sha256sum dmg/SpecDeck-x64.dmg | awk '{print $1}')
          mkdir -p tap/Casks
          unsigned=""
          [ "$SIGNED" = true ] || unsigned=unsigned
          scripts/render-cask.sh "${TAG#v}" "$sha_arm" "$sha_intel" "$REPO" $unsigned > tap/Casks/specdeck.rb
          cat tap/Casks/specdeck.rb
      - name: Commit and push
        if: env.TAP_KEY != ''
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/specdeck.rb
          if git diff --cached --quiet; then
            echo "No cask changes"
            exit 0
          fi
          git commit -m "specdeck ${TAG#v}"
          git push
