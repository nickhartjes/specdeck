name: Docs

# Builds the documentation site (docs/site) and checks its links on pull requests, and publishes it
# to GitHub Pages from main. Pages must be set to deploy from GitHub Actions (Settings > Pages > Source).
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'README.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/site/**', 'README.md', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# The deploy job adds what Pages needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Starlight's "last updated" dates come from the git history.
          fetch-depth: 0

      # Node and pnpm pinned in mise.toml.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: docs/site

      - run: pnpm build
        working-directory: docs/site

      # Links and anchors in the site, the sidebar, and the README's links into the site.
      - run: pnpm check-links
        working-directory: docs/site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
