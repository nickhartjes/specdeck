# Release builds, started by pushing a tag like v1.0.0 that matches the app version
# (Cargo.toml workspace version and app/src-tauri/tauri.conf.json). Design decision 13.
#
# A new minor version needs its session transcript: run `just record-transcript` after the
# version bump and commit crates/session/transcripts/<protocol>.jsonl (session-processes task
# 8.2); the tests fail without it.
#
# The installers are uploaded to a draft GitHub release under stable names, which the Homebrew
# cask and the user guide use; the draft is published once every platform has uploaded. Tags
# with a suffix (v1.1.0-rc.1) are published as prereleases.
#
# The sharing service image (web viewer included) goes to ghcr.io/nickhartjes/specdeck-server for
# linux/amd64 and linux/arm64, tagged 1.7.0, and for stable releases also 1.7, 1 and latest. Until
# 1.9.0 the same image also goes to ghcr.io/nickhartjes/specdeck-signalling, its name before 1.7.0.
# Each name is signed with keyless cosign as this workflow at the tag; the release is published
# only after that (publish-signalling-image design decisions 1 to 5, rename-signalling-to-server
# decisions 3 to 5). Pushed with GITHUB_TOKEN: no secret.
#
# Secrets of the `release` environment, which only v* tags and main may use, and only the admin may
# create v* tags: collaborators' branches cannot read them (signing and notarization are skipped
# while they are missing). The package jobs build with these:
#   SPECDECK_SIGNALLING_URL   the team's sharing service, baked into the app
#   APPLE_CERTIFICATE (base64 .p12, Developer ID Application), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY    signing on macOS (without them the app is ad-hoc signed)
#   APPLE_API_KEY (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER   notarization
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD   signing on Windows
#   HOMEBREW_TAP_DEPLOY_KEY   write access to nickhartjes/homebrew-tap (see homebrew.yml)
#
# Secrets of the `update-signing` environment, which only v* tags may use, read by the sign-updates
# job alone: it builds nothing and runs no project code, so no build step, dependency or action of
# the build can read the update key (release-integrity: Update key only where updates are signed):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   signing updates (auto-update
#                             design decisions 2 to 4); without them the release has no update
#                             files and no latest.json, so installed apps find nothing to update
#
# Every release also gets SHA256SUMS and a GitHub build provenance attestation for its installers
# and update files (checksums job); the draft is published only after both.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release notes list the commits since the previous release tag.
          fetch-depth: 0
      - name: Check the tag matches the app version
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tauri_version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ] || [ "v$tauri_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and tauri.conf.json ($tauri_version)"
            exit 1
          fi
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  package:
    name: Release (${{ matrix.name }})
    needs: draft
    strategy:
      # One platform failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          # `platform` names the job's checksums artifact. `rename` lists every file the job
          # uploads; the update files are among them: on macOS the zipped .app, on Windows and
          # Linux the installer itself. sign-updates signs them.
          - name: macOS arm64
            platform: macos-arm64
            os: macos-latest
            bundles: app,dmg
            rename: 'dmg/*.dmg=SpecDeck-arm64.dmg macos/*.app.tar.gz=SpecDeck-arm64.app.tar.gz'
          # Built natively on Intel: cross-compiling the vendored OpenSSL and libdatachannel is fragile.
          - name: macOS x64
            platform: macos-x64
            os: macos-15-intel
            bundles: app,dmg
            rename: 'dmg/*.dmg=SpecDeck-x64.dmg macos/*.app.tar.gz=SpecDeck-x64.app.tar.gz'
          - name: Windows
            platform: windows
            os: windows-latest
            bundles: nsis
            rename: 'nsis/*.exe=SpecDeck-x64-setup.exe'
          # The oldest supported Ubuntu, so the AppImage runs on older distributions too.
          - name: Linux
            platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            rename: 'appimage/*.AppImage=SpecDeck-x86_64.AppImage deb/*.deb=SpecDeck-amd64.deb'
    runs-on: ${{ matrix.os }}
    # Not update-signing: no step of this job can read the update key (sign-updates).
    environment: release
    env:
      SPECDECK_SIGNALLING_URL: ${{ secrets.SPECDECK_SIGNALLING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Tools pinned in mise.toml: Rust, Node, pnpm, just, cmake.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # Restores main's cache and saves none: a cache saved for a tag can be restored by no later run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: just install

      - name: Set up signing on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Tauri signs when these are set; otherwise the bundle keeps its ad-hoc signature.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS app is not signed with a Developer ID."
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            } >> "$GITHUB_ENV"
          fi

      # The build step runs in Git Bash, whose Perl lacks modules OpenSSL's Configure needs; `just
      # package` in CI runs in PowerShell, where the runner's Strawberry Perl comes first.
      - name: Use Strawberry Perl for OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "OPENSSL_SRC_PERL=$((Get-Command perl).Source)"

      - name: Set up signing on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE is not set; the Windows installer is not signed."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Compress -Depth 4
          Add-Content $env:GITHUB_ENV "TAURI_SIGNING_CONFIG=$config"

      - name: Build the installers
        shell: bash
        run: |
          configs=()
          if [ -n "${TAURI_SIGNING_CONFIG:-}" ]; then
            configs+=(--config "$TAURI_SIGNING_CONFIG")
          fi
          # tauri.bundle.conf.json adds the session binary (session-processes design decision 1).
          pnpm tauri build --bundles ${{ matrix.bundles }} --config app/src-tauri/tauri.bundle.conf.json "${configs[@]}"

      # The macOS update file: the .app with one SpecDeck.app folder at the top, as the updater
      # expects. Made here without the update key, which createUpdaterArtifacts would need; no
      # AppleDouble files, which would end up inside the installed bundle.
      - name: Zip the app for updates on macOS
        if: runner.os == 'macOS'
        run: COPYFILE_DISABLE=1 tar -czf target/release/bundle/macos/SpecDeck.app.tar.gz -C target/release/bundle/macos SpecDeck.app

      - name: Check installer size
        shell: bash
        run: scripts/check-installer-size.sh 25 100 target/release/bundle

      - name: Check installers carry the session binary
        shell: bash
        run: scripts/check-session-binary.sh target/release/bundle

      - name: Upload to the draft under stable names
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upload
          for pair in ${{ matrix.rename }}; do
            pattern=${pair%%=*}
            name=${pair#*=}
            # shellcheck disable=SC2086
            set -- target/release/bundle/$pattern
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Expected one file for $pattern, found: $*"
              exit 1
            fi
            cp "$1" "upload/$name"
          done
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber
          # What was uploaded, for the checksums job to compare the draft with. macOS has shasum only.
          sha256() { if command -v sha256sum > /dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd upload && sha256 -- *) > "sums-${{ matrix.platform }}.txt"
          cat "sums-${{ matrix.platform }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.platform }}
          path: sums-${{ matrix.platform }}.txt
          if-no-files-found: error

  # Each platform builds natively (emulated arm64 would take hours) and is pushed by digest only;
  # image-merge tags the two as one image.
  image:
    name: Image (${{ matrix.platform }})
    needs: draft
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The OCI labels link the package to this repository on ghcr.io.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/specdeck-server
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read the pnpm version from mise.toml
        id: pnpm
        run: echo "version=$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server.Dockerfile
          build-args: PNPM_VERSION=${{ steps.pnpm.outputs.version }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/specdeck-server,push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for image-merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ runner.arch }}
          path: digests/*
          if-no-files-found: error

  image-merge:
    name: Tag and sign the image
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signs with this workflow's OIDC identity.
      id-token: write
    env:
      # Where image pushed the digests.
      IMAGE: ghcr.io/${{ github.repository_owner }}/specdeck-server
      # Every name the release is published and signed under, one per line. specdeck-signalling is
      # the name before 1.7.0: remove it in 1.9.0 (rename-signalling-to-server decision 5).
      IMAGES: |
        ghcr.io/${{ github.repository_owner }}/specdeck-server
        ghcr.io/${{ github.repository_owner }}/specdeck-signalling
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      # {{major}} and {{major}}.{{minor}} come out as the full version for a prerelease, so
      # v1.7.0-rc.1 gets only 1.7.0-rc.1; latest is set by hand for stable tags only.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGES }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # One image, written under every name and tag from the specdeck-server digests; ghcr.io
      # mounts the layers across the names, so every name has the same digest.
      - name: Create the multi-platform image
        id: merge
        working-directory: digests
        run: |
          set -euo pipefail
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected an amd64 and an arm64 digest, found: ${digests[*]}"
            exit 1
          fi
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${digests[@]/#/$IMAGE@sha256:}"
          version='${{ steps.meta.outputs.version }}'
          docker buildx imagetools inspect "$IMAGE:$version"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          while read -r name; do
            [ -n "$name" ] || continue
            other=$(docker buildx imagetools inspect "$name:$version" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$other" != "$digest" ]; then
              echo "::error::$name:$version is $other, not $digest"
              exit 1
            fi
          done <<< "$IMAGES"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # By digest, never a tag, so the signature covers exactly what was pushed. A signature is
      # stored in its image's repository, so each name is signed.
      - name: Sign
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          set -euo pipefail
          while read -r name; do
            [ -n "$name" ] || continue
            cosign sign --yes "$name@$DIGEST"
          done <<< "$IMAGES"

  # The only job that can read the update key (update-signing environment). It builds nothing
  # and installs nothing of the project: the Tauri CLI at the lockfile's version, without its
  # package scripts, signs the update files package uploaded to the draft.
  sign-updates:
    name: Sign the update files
    needs: package
    runs-on: ubuntu-latest
    environment: update-signing
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # Installed apps then find no update, as when the key was missing from the build: the zipped
      # macOS apps leave the draft, and publish writes no latest.json without signatures.
      - name: Check for the update key
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; this release has no update files."
          gh release delete-asset "$GITHUB_REF_NAME" SpecDeck-arm64.app.tar.gz --yes
          gh release delete-asset "$GITHUB_REF_NAME" SpecDeck-x64.app.tar.gz --yes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - name: Install the Tauri CLI
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          version=$(sed -n "s/^  '@tauri-apps\/cli@\([0-9][0-9.]*\)':\$/\1/p" pnpm-lock.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No @tauri-apps/cli version in pnpm-lock.yaml"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          npm install --ignore-scripts --no-save --no-audit --no-fund "@tauri-apps/cli@$version"
          echo "$RUNNER_TEMP/cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Download the update files
        if: env.HAS_KEY == 'true'
        run: |
          mkdir -p updates
          # The update files of scripts/latest-json.mjs.
          gh release download "$GITHUB_REF_NAME" --dir updates \
            -p SpecDeck-arm64.app.tar.gz -p SpecDeck-x64.app.tar.gz \
            -p SpecDeck-x64-setup.exe -p SpecDeck-x86_64.AppImage
      - name: Sign
        if: env.HAS_KEY == 'true'
        working-directory: updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # tauri build binds the signature to the app version by itself; signing by hand does not.
          for file in SpecDeck-arm64.app.tar.gz SpecDeck-x64.app.tar.gz SpecDeck-x64-setup.exe SpecDeck-x86_64.AppImage; do
            tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "$file"
          done
      - name: Upload the signatures
        if: env.HAS_KEY == 'true'
        run: gh release upload "$GITHUB_REF_NAME" updates/*.sig --clobber

  # SHA256SUMS and a build provenance attestation for every installer and update file, from a job
  # that built nothing, so no build step holds an OIDC token. The draft is checked against what
  # each package job recorded, so an asset replaced in between is caught.
  checksums:
    name: Checksums and provenance
    needs: [package, sign-updates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          merge-multiple: true
          path: sums
      - name: Compare the draft with the build jobs' hashes
        run: |
          set -euo pipefail
          # Git Bash on Windows may mark names with `*` (binary mode); the same hash either way.
          sed 's/^\([0-9a-f]\{64\}\) [ *]/\1  /' sums/*.txt > recorded.txt
          mkdir -p files
          # Every asset but the signatures and latest.json, which are not attested.
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
            grep -v -e '\.sig$' -e '^latest\.json$' > names.txt
          if [ ! -s names.txt ]; then
            echo "::error::The draft has no installers"
            exit 1
          fi
          while read -r name; do
            gh release download "$GITHUB_REF_NAME" --dir files -p "$name"
          done < names.txt
          : > SHA256SUMS
          while read -r name; do
            actual=$(cd files && sha256sum -- "$name")
            if ! grep -qxF -- "$actual" recorded.txt; then
              echo "::error::$name in the draft is not the file a build job uploaded"
              exit 1
            fi
            echo "$actual" >> SHA256SUMS
          done < names.txt
          LC_ALL=C sort -k 2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

  publish:
    name: Publish release
    # Not before the image is pushed and signed, the updates are signed, and the checksums and
    # provenance are written: a release never names a missing image or lacks them.
    needs: [package, image-merge, sign-updates, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Apps look for latest.json in the newest release; it names each platform's update file
      # and signature. Written only when sign-updates uploaded signatures.
      - name: Add latest.json for installed apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p signatures
          if ! gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir signatures; then
            echo "::warning::No update signatures in this release; it has no latest.json."
            exit 0
          fi
          node scripts/latest-json.mjs "$GITHUB_REF_NAME" "$GH_REPO" signatures > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease"

  homebrew:
    name: Update Homebrew cask
    needs: publish
    # Prereleases do not go to Homebrew.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
