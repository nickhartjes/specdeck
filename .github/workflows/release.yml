# Release builds, started by pushing a tag like v1.0.0 that matches the app version
# (Cargo.toml workspace version and app/src-tauri/tauri.conf.json). Design decision 13.
#
# The installers are uploaded to a draft GitHub release under stable names, which the Homebrew
# cask and the user guide use; the draft is published once every platform has uploaded. Tags
# with a suffix (v1.1.0-rc.1) are published as prereleases.
#
# The signalling image (web viewer included) goes to ghcr.io/nickhartjes/specdeck-signalling for
# linux/amd64 and linux/arm64, tagged 1.6.0, and for stable releases also 1.6, 1 and latest. It is
# signed with keyless cosign as this workflow at the tag; the release is published only after
# that (publish-signalling-image design decisions 1 to 5). Pushed with GITHUB_TOKEN: no secret.
#
# Repository secrets (signing and notarization are skipped while they are missing):
#   SPECDECK_SIGNALLING_URL   the team's sharing service, baked into the app
#   APPLE_CERTIFICATE (base64 .p12, Developer ID Application), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY    signing on macOS (without them the app is ad-hoc signed)
#   APPLE_API_KEY (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER   notarization
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD   signing on Windows
#   HOMEBREW_TAP_DEPLOY_KEY   write access to nickhartjes/homebrew-tap (see homebrew.yml)
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   signing updates (auto-update
#                             design decisions 2 to 4); without them the release has no update
#                             files and no latest.json, so installed apps find nothing to update
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes list the commits since the previous release tag.
          fetch-depth: 0
      - name: Check the tag matches the app version
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tauri_version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ] || [ "v$tauri_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and tauri.conf.json ($tauri_version)"
            exit 1
          fi
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  package:
    name: Release (${{ matrix.name }})
    needs: draft
    strategy:
      # One platform failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          # `updates`: the update file and its signature, uploaded only when updates are signed. On
          # macOS that is the zipped .app; on Windows and Linux the installer itself, plus its .sig.
          - name: macOS arm64
            os: macos-latest
            bundles: app,dmg
            rename: 'dmg/*.dmg=SpecDeck-arm64.dmg'
            updates: 'macos/*.app.tar.gz=SpecDeck-arm64.app.tar.gz macos/*.app.tar.gz.sig=SpecDeck-arm64.app.tar.gz.sig'
          # Built natively on Intel: cross-compiling the vendored OpenSSL and libdatachannel is fragile.
          - name: macOS x64
            os: macos-15-intel
            bundles: app,dmg
            rename: 'dmg/*.dmg=SpecDeck-x64.dmg'
            updates: 'macos/*.app.tar.gz=SpecDeck-x64.app.tar.gz macos/*.app.tar.gz.sig=SpecDeck-x64.app.tar.gz.sig'
          - name: Windows
            os: windows-latest
            bundles: nsis
            rename: 'nsis/*.exe=SpecDeck-x64-setup.exe'
            updates: 'nsis/*.exe.sig=SpecDeck-x64-setup.exe.sig'
          # The oldest supported Ubuntu, so the AppImage runs on older distributions too.
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            rename: 'appimage/*.AppImage=SpecDeck-x86_64.AppImage deb/*.deb=SpecDeck-amd64.deb'
            updates: 'appimage/*.AppImage.sig=SpecDeck-x86_64.AppImage.sig'
    runs-on: ${{ matrix.os }}
    env:
      SPECDECK_SIGNALLING_URL: ${{ secrets.SPECDECK_SIGNALLING_URL }}
      # Tauri signs the update files with these; empty when the secrets are missing.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Tools pinned in mise.toml: Rust, Node, pnpm, just, cmake.
      - uses: jdx/mise-action@v5
      # Also saved when a later step fails: otherwise every failing run starts cold.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: just install

      - name: Set up signing on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Tauri signs when these are set; otherwise the bundle keeps its ad-hoc signature.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS app is not signed with a Developer ID."
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            } >> "$GITHUB_ENV"
          fi

      # The build step runs in Git Bash, whose Perl lacks modules OpenSSL's Configure needs; `just
      # package` in CI runs in PowerShell, where the runner's Strawberry Perl comes first.
      - name: Use Strawberry Perl for OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "OPENSSL_SRC_PERL=$((Get-Command perl).Source)"

      - name: Set up signing on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE is not set; the Windows installer is not signed."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Compress -Depth 4
          Add-Content $env:GITHUB_ENV "TAURI_SIGNING_CONFIG=$config"

      - name: Build the installers
        shell: bash
        run: |
          configs=()
          if [ -n "${TAURI_SIGNING_CONFIG:-}" ]; then
            configs+=(--config "$TAURI_SIGNING_CONFIG")
          fi
          # Update files need the private key: Tauri fails the build when it is missing.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            configs+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; this release has no update files."
          fi
          pnpm tauri build --bundles ${{ matrix.bundles }} "${configs[@]}"

      - name: Check installer size
        shell: bash
        run: scripts/check-installer-size.sh 25 100 target/release/bundle

      - name: Upload to the draft under stable names
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upload
          files='${{ matrix.rename }}'
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            files="$files ${{ matrix.updates }}"
          fi
          for pair in $files; do
            pattern=${pair%%=*}
            name=${pair#*=}
            # shellcheck disable=SC2086
            set -- target/release/bundle/$pattern
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Expected one file for $pattern, found: $*"
              exit 1
            fi
            cp "$1" "upload/$name"
          done
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber

  # Each platform builds natively (emulated arm64 would take hours) and is pushed by digest only;
  # image-merge tags the two as one image.
  image:
    name: Image (${{ matrix.platform }})
    needs: draft
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The OCI labels link the package to this repository on ghcr.io.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/specdeck-signalling
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/signalling.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/specdeck-signalling,push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for image-merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ runner.arch }}
          path: digests/*
          if-no-files-found: error

  image-merge:
    name: Tag and sign the image
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signs with this workflow's OIDC identity.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/specdeck-signalling
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests
      # {{major}} and {{major}}.{{minor}} come out as the full version for a prerelease, so
      # v1.7.0-rc.1 gets only 1.7.0-rc.1; latest is set by hand for stable tags only.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-platform image
        id: merge
        working-directory: digests
        run: |
          set -euo pipefail
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected an amd64 and an arm64 digest, found: ${digests[*]}"
            exit 1
          fi
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${digests[@]/#/$IMAGE@sha256:}"
          version='${{ steps.meta.outputs.version }}'
          docker buildx imagetools inspect "$IMAGE:$version"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.3
      # By digest, never a tag, so the signature covers exactly what was pushed.
      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ steps.merge.outputs.digest }}"

  publish:
    name: Publish release
    # Not before the image is pushed and signed, so a release never names a missing image.
    needs: [package, image-merge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Apps look for latest.json in the newest release; it names each platform's update file
      # and signature. Written only when the build jobs uploaded signatures.
      - name: Add latest.json for installed apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p signatures
          if ! gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir signatures; then
            echo "::warning::No update signatures in this release; it has no latest.json."
            exit 0
          fi
          node scripts/latest-json.mjs "$GITHUB_REF_NAME" "$GH_REPO" signatures > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease"

  homebrew:
    name: Update Homebrew cask
    needs: publish
    # Prereleases do not go to Homebrew.
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
