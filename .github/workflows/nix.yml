name: Nix

# The flake builds SpecDeck from source (design decision 13); a dependency change that breaks the
# Nix build shows up here rather than for Nix users. The build takes about 14 minutes and cannot
# use a cache, because any change to the source rebuilds the package. So pull requests run it only
# when they touch what the Nix build depends on beyond the code itself; every push to main runs it.
on:
  push:
    branches: [main]
    # Specs, design docs and the root Markdown files are not part of the build.
    paths-ignore: ['openspec/**', 'docs/**', '*.md', LICENSE]
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.lock
      - '**/Cargo.toml'
      - '**/build.rs'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - app/ui/package.json
      - app/src-tauri/tauri.conf.json
      - app/src-tauri/tauri.bundle.conf.json
      - scripts/session-binary.mjs
      - .github/workflows/nix.yml
  workflow_dispatch:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default -L
      - name: The binary starts
        run: xvfb-run --auto-servernum timeout 15 ./result/bin/specdeck-app || [ $? -eq 124 ]
