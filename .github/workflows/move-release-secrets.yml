# One-off, removed after use: copies the release secrets from the repository into the `release`
# environment (see release.yml), and leaves the Tauri update key, encrypted with age to the owner's
# SSH key, as an artifact to keep outside GitHub. Nothing is printed.
#
# Temporary repository secret:
#   SECRETS_ADMIN_TOKEN   fine-grained token for this repository with Secrets: read and write
name: Move release secrets

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: SSH public key (ssh-ed25519 ...) the backup is encrypted to
        required: true

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      SPECDECK_SIGNALLING_URL: ${{ secrets.SPECDECK_SIGNALLING_URL }}
    steps:
      - name: Back up the Tauri update key
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          sudo apt-get install -y age >/dev/null
          mkdir backup
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | age -r "$RECIPIENT" -o backup/tauri-signing-private-key.age
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | age -r "$RECIPIENT" -o backup/tauri-signing-private-key-password.age

      - uses: actions/upload-artifact@v7
        with:
          name: tauri-signing-key-backup
          path: backup/
          retention-days: 1

      - name: Copy into the release environment
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD HOMEBREW_TAP_DEPLOY_KEY SPECDECK_SIGNALLING_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty"; exit 1; fi
            printf '%s' "${!name}" | gh secret set "$name" --env release --repo "$REPO"
            echo "$name copied"
          done
