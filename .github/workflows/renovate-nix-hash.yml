name: Renovate Nix hash

# nix/package.nix pins a hash of the app's npm dependencies, so every Renovate update to them
# breaks the Nix build until the hash is updated, which Renovate cannot do itself. This builds only
# the npm dependencies, takes the hash Nix reports, and commits it to the Renovate branch.
# renovate.json ignores this bot's commits, so Renovate keeps updating the branch. The commit is
# pushed with this run's own GITHUB_TOKEN, given to git push alone: the checkout keeps no
# credential, so Nix and the build run without one, and no token outlives the run
# (release-integrity: No long-lived token for dependency updates). A push with GITHUB_TOKEN starts
# no workflows, so this starts CI and Nix for the new commit itself; their checks show on the pull
# request.
on:
  push:
    branches: ['renovate/**']
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - app/ui/package.json

concurrency:
  group: renovate-nix-hash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  hash:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Update the hash if it changed
        id: update
        run: |
          if nix build .#specdeck.pnpmDeps --no-link -L 2>build.log; then
            echo "The hash is up to date."
            exit 0
          fi
          hash=$(sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+/=]*\)$/\1/p' build.log | head -n 1)
          if [ -z "$hash" ]; then
            tail -n 40 build.log
            echo "::error::The npm dependencies failed to build for another reason than the hash."
            exit 1
          fi
          sed -i "s|hash = \"sha256-[A-Za-z0-9+/=]*\";|hash = \"$hash\";|" nix/package.nix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Update the pnpm dependency hash in nix/package.nix"
          echo "committed=true" >> "$GITHUB_OUTPUT"
      # The token is given to this step only, after Nix has run.
      - name: Push the new hash
        if: steps.update.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:${GITHUB_REF_NAME}"
      - name: Start CI and Nix for the new commit
        if: steps.update.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          gh workflow run nix.yml --ref "$GITHUB_REF_NAME"
