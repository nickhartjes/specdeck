name: Renovate Nix hash

# nix/package.nix pins a hash of the app's npm dependencies, so every Renovate update to them
# breaks the Nix build until the hash is updated, which Renovate cannot do itself. This builds only
# the npm dependencies, takes the hash Nix reports, and commits it to the Renovate branch.
# renovate.json ignores this bot's commits, so Renovate keeps updating the branch. The commit is
# pushed with RENOVATE_NIX_HASH_TOKEN, a fine-grained personal access token for this repository
# with Contents read and write only, so the pull request runs CI and Nix for it as for any other
# push. Without that secret it is pushed with GITHUB_TOKEN, which starts no workflows: CI and Nix
# are then started by hand, and the pull request's own runs for the commit wait for approval.
on:
  push:
    branches: ['renovate/**']
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - app/ui/package.json

concurrency:
  group: renovate-nix-hash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  hash:
    runs-on: ubuntu-26.04
    env:
      HAS_TOKEN: ${{ secrets.RENOVATE_NIX_HASH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Also the credential git push uses below; the commit's author stays the bot.
          token: ${{ secrets.RENOVATE_NIX_HASH_TOKEN || github.token }}
      - uses: cachix/install-nix-action@v31
      - name: Update the hash if it changed
        id: update
        run: |
          if nix build .#specdeck.pnpmDeps --no-link -L 2>build.log; then
            echo "The hash is up to date."
            exit 0
          fi
          hash=$(sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+/=]*\)$/\1/p' build.log | head -n 1)
          if [ -z "$hash" ]; then
            tail -n 40 build.log
            echo "::error::The npm dependencies failed to build for another reason than the hash."
            exit 1
          fi
          sed -i "s|hash = \"sha256-[A-Za-z0-9+/=]*\";|hash = \"$hash\";|" nix/package.nix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Update the pnpm dependency hash in nix/package.nix"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Start CI and Nix for the new commit
        if: steps.update.outputs.pushed == 'true' && env.HAS_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::RENOVATE_NIX_HASH_TOKEN is not set; the pull request's CI and Nix runs for this commit need approval."
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          gh workflow run nix.yml --ref "$GITHUB_REF_NAME"
