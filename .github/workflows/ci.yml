name: CI

# Changes to specs, design docs and the root Markdown files build nothing, so they run no CI. A
# push or pull request that also touches anything else still runs it all.
on:
  push:
    branches: [main]
    paths-ignore: ['openspec/**', 'docs/**', '*.md', LICENSE]
  pull_request:
    paths-ignore: ['openspec/**', 'docs/**', '*.md', LICENSE]
  # Started by renovate-nix-hash.yml for the commit it pushes, which starts no workflow itself.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Line tables are enough for test backtraces; full debug info made the Rust caches 2 GB per
# platform, close to GitHub's 10 GB for all caches, and slowed linking.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Tools pinned in mise.toml: Rust, Node, pnpm, just, cmake.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      # Also saved when a later step fails: otherwise every failing run starts cold.
      # Saved from main only: PRs restore main's cache. Each OS's cache is 1.2-1.7 GB, so PR copies
      # pushed the total past GitHub's 10 GB and got caches evicted, which made runs start cold.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: just install

      - run: just check

      # session-processes: the app still understands sessions the previous release started, from
      # that release's recorded transcript (app/src-tauri/src/adapter.rs). Part of just check too;
      # its own step, so a failure says what broke. With --workspace, as just check, so it reuses
      # that build: -p resolves other features and rebuilds the vendored libdatachannel and OpenSSL,
      # about 9 minutes on Windows.
      - name: Sessions of the previous release
        run: cargo test --workspace adapter::tests

      # The web viewer is the same on every platform, and its recipes use bash: once, on Linux.
      - name: Web viewer
        if: runner.os == 'Linux'
        run: just check-web

      # session-streaming: Session capacity. A measurement, so it runs on its own after the tests,
      # in a step rather than a job so it shares this job's Rust cache. Reported, not enforced, for
      # now: on Ubuntu runners 20 viewers added 15 to 110 ms to the host's echo between runs, even
      # alone, while macOS and Windows showed almost nothing; that cost is still being looked into.
      - name: Capacity (20 viewers)
        continue-on-error: true
        run: just capacity

      - run: just package

      - name: Check installer size
        shell: bash
        run: scripts/check-installer-size.sh 25 100 target/release/bundle

      - name: Check installers carry the session binary
        shell: bash
        run: scripts/check-session-binary.sh target/release/bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  # The sharing service image with the web viewer built in (web-viewer design decision 5), as
  # self-hosters build it: it builds, runs as UID 10001, and serves the page next to /signal.
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With the pnpm of mise.toml, as the release builds it.
      - run: docker build --build-arg PNPM_VERSION="$(sed -n 's/^pnpm = "\(.*\)"$/\1/p' mise.toml)" -f docker/server.Dockerfile -t specdeck-server:ci .

      - name: Serve the web viewer from the image
        run: |
          test "$(docker inspect --format '{{.Config.User}}' specdeck-server:ci)" = 10001
          docker run --detach --name server --publish 8080:8080 specdeck-server:ci
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/web-viewer.json | grep -q '"protocol"'
          curl -sf http://127.0.0.1:8080/join | grep -q '<div id="root">'
          curl -sfI http://127.0.0.1:8080/join | grep -qi '^content-security-policy:'

  # The Compose and Kubernetes relays as self-hosters start them: coturn exits on options it no
  # longer accepts (4.18 refuses --no-dtls), and a Renovate bump of the image would otherwise ship
  # that unnoticed. scripts/check-relay-manifests.sh keeps both on the same version.
  relay:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the Compose relay
        working-directory: deploy/compose
        env:
          SPECDECK_DOMAIN: ci.invalid
          SPECDECK_VERSION: ci
          TURN_DOMAIN: ci.invalid
          TURN_EXTERNAL_IP: 127.0.0.1
          TURN_SECRET: ci
        run: |
          docker compose up --detach coturn
          sleep 10
          docker compose logs coturn
          id=$(docker compose ps --all --quiet coturn)
          test "$(docker inspect --format '{{.State.Running}} {{.RestartCount}}' "$id")" = "true 0"
          # Both use the host's ports.
          docker compose down

      # The manifest's image and arguments, with its $(…) variables filled in, as its pod runs them:
      # as nobody, with a read-only root and the state directory writable.
      - name: Start the Kubernetes relay
        run: |
          set -euo pipefail
          manifest=deploy/k8s/base/coturn.yaml
          image=$(sed -n 's/^ *image: *\(coturn\/coturn:[^ ]*\)$/\1/p' "$manifest")
          # The manifest's $(…) are Kubernetes variables, quoted on purpose.
          # shellcheck disable=SC2016
          mapfile -t args < <(
            awk '/^ *args:$/ { on = 1; next } on && /^ *[a-z]+:/ { on = 0 } on && /^ *- --/ { sub(/^ *- /, ""); print }' "$manifest" |
              sed -e 's/\$(TURN_EXTERNAL_IP)/127.0.0.1/' -e 's/\$(TURN_SECRET)/ci/' -e 's/\$(POD_IP)/127.0.0.1/'
          )
          # shellcheck disable=SC2016
          if [ -z "$image" ] || [ "${#args[@]}" -lt 10 ] || printf '%s\n' "${args[@]}" | grep -q '\$('; then
            echo "::error::Could not read the image and arguments from $manifest"
            exit 1
          fi
          docker run --detach --name k8s-relay --network host --user 65534:65534 --read-only \
            --tmpfs /var/lib/coturn:uid=65534,gid=65534 "$image" "${args[@]}"
          sleep 10
          docker logs k8s-relay
          test "$(docker inspect --format '{{.State.Running}} {{.RestartCount}}' k8s-relay)" = "true 0"
