name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by renovate-nix-hash.yml for the commit it pushes, which starts no workflow itself.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Tools pinned in mise.toml: Rust, Node, pnpm, just, cmake.
      - uses: jdx/mise-action@v5

      # Also saved when a later step fails: otherwise every failing run starts cold.
      # Saved from main only: PRs restore main's cache. Each OS's cache is 1.2-1.7 GB, so PR copies
      # pushed the total past GitHub's 10 GB and got caches evicted, which made runs start cold.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: just install

      - run: just check

      # The web viewer is the same on every platform, and its recipes use bash: once, on Linux.
      - name: Web viewer
        if: runner.os == 'Linux'
        run: just check-web

      # session-streaming: Session capacity. A measurement, so it runs on its own after the tests,
      # in a step rather than a job so it shares this job's Rust cache. Reported, not enforced, for
      # now: on Ubuntu runners 20 viewers added 15 to 110 ms to the host's echo between runs, even
      # alone, while macOS and Windows showed almost nothing; that cost is still being looked into.
      - name: Capacity (20 viewers)
        continue-on-error: true
        run: just capacity

      - run: just package

      - name: Check installer size
        shell: bash
        run: scripts/check-installer-size.sh 25 100 target/release/bundle

      - name: Check installers carry the session binary
        shell: bash
        run: scripts/check-session-binary.sh target/release/bundle

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  # The sharing service image with the web viewer built in (web-viewer design decision 5), as
  # self-hosters build it: it builds, runs as UID 10001, and serves the page next to /signal.
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - run: docker build -f docker/server.Dockerfile -t specdeck-server:ci .

      - name: Serve the web viewer from the image
        run: |
          test "$(docker inspect --format '{{.Config.User}}' specdeck-server:ci)" = 10001
          docker run --detach --name server --publish 8080:8080 specdeck-server:ci
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/web-viewer.json | grep -q '"protocol"'
          curl -sf http://127.0.0.1:8080/join | grep -q '<div id="root">'
          curl -sfI http://127.0.0.1:8080/join | grep -qi '^content-security-policy:'
